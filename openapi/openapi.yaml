openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: >
    Навчальний API до ДЗ №9 курсового проєкту: контракт Marketplace API
    (товари та замовлення) із cursor-пагінацією, Idempotency-Key на
    створенні замовлення та problem+json (RFC 9457) як єдиним форматом
    помилок. Реалізація (варіант Б) — сервер на NestJS, де кожен запит і
    кожна відповідь звіряються з цією спекою через express-openapi-validator.
servers:
  - url: http://localhost:3000
    description: Локальний застосунок
# hw-24: усе, крім явно відкритих операцій (security: [] нижче), вимагає
# Bearer-access-токен. Саму перевірку (підпис, exp, денилист) робить Nest-гард,
# а не валідатор спеки: у main.ts стоїть validateSecurity: false, інакше
# валідатор відповів би за гард власним 401 без problem+json.
security:
  - bearerAuth: []
tags:
  - name: products
    description: Каталог товарів
  - name: orders
    description: Замовлення покупців
  - name: auth
    description: Автентифікація (hw-24)
paths:
  /products:
    get:
      operationId: listProducts
      security: []
      summary: Список товарів
      description: Сторінка каталогу товарів із cursor-пагінацією.
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Сторінка товарів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createProduct
      summary: Додати товар
      description: >
        Рівень РОЛІ (hw-24): лише seller або admin. Покупець (customer) із
        валідним токеном отримує 403, без токена — 401.
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Товар створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /products/{id}:
    get:
      operationId: getProduct
      security: []
      summary: Отримати товар за ідентифікатором
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders:
    get:
      operationId: listOrders
      summary: Список замовлень
      description: Сторінка замовлень із cursor-пагінацією.
      tags: [orders]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Сторінка замовлень
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createOrder
      summary: Створити замовлення
      tags: [orders]
      parameters:
        # Навмисно інлайн, а не $ref: `redocly bundle` (без --dereferenced)
        # лишає локальні $ref нерозгорнутими, а acceptance-скрипт із task.md
        # читає spec.json напряму — parameters[].in/name мають бути тут.
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Ключ ідемпотентності клієнтської спроби створення замовлення.
            Якщо клієнт повторює POST із тим самим значенням Idempotency-Key і
            тим самим тілом запиту (наприклад, після таймауту чи обриву
            зʼєднання, коли невідомо, чи дійшла попередня відповідь), сервер
            має трактувати це як ПОВТОР тієї самої спроби, а не як нове
            замовлення, і повернути ту саму відповідь.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Замовлення створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Отримати замовлення за ідентифікатором
      tags: [orders]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Замовлення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      summary: Змінити статус замовлення
      description: >
        Ставить замовленню новий статус і емітить подію order.status у
        realtime-шар (ДЗ №8/hw-18) — WebSocket-кімнату orders/{id} і
        SSE-потік GET /orders/{id}/events.
      tags: [orders]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Статус оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  # GET /orders/{id}/events (SSE, hw-18) свідомо НЕ в цій спеці: тіло —
  # нескінченний text/event-stream, а не JSON, звірити зі схемою нічого;
  # ignoreUndocumented: true в src/main.ts пропускає його так само, як
  # /health, /health/db.
  /auth/login:
    post:
      operationId: login
      summary: Логін — видача пари токенів
      description: >
        Автентифікація: email + пароль -> access (JWT, короткий) і refresh
        (непрозорий, довгий). Кожен логін відкриває нову сімʼю refresh-токенів.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пара токенів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Ротація refresh-токена
      description: >
        Обмінює refresh на НОВУ пару і вбиває старий. Повторне пред'явлення
        вже використаного refresh — сигнал компрометації: уся сімʼя
        відкликається, а відповідь — 401 (RFC 9700 §4.14.2).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Нова пара токенів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Логаут — дві дії
      description: >
        (1) відкликає сімʼю refresh-токенів поточної сесії, (2) кладе jti
        поточного access-токена в денилист із TTL = залишок його життя.
        Обидві дії — в одній транзакції Postgres.
      tags: [auth]
      responses:
        '204':
          description: Сесію закрито
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access-токен ES256. Немає / протух / зіпсований — 401; валідний, але
        прав немає — 403.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Максимальна кількість елементів на сторінці.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: >
        Непрозорий токен курсора зі значення next_cursor попередньої
        відповіді. Клієнт не повинен розбирати чи формувати його сам —
        лише передавати назад тим, яким отримав.
      schema:
        type: string
    ProductId:
      name: id
      in: path
      required: true
      description: Ідентифікатор товару.
      schema:
        type: string
    OrderId:
      name: id
      in: path
      required: true
      description: Ідентифікатор замовлення.
      schema:
        type: string
  schemas:
    Product:
      type: object
      required: [id, name, price_cents]
      properties:
        id:
          type: string
          example: p1
        name:
          type: string
          example: Клавіатура механічна
        price_cents:
          type: integer
          description: Ціна в копійках — без float.
          example: 129900
    ProductPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
          description: Токен наступної сторінки; null = сторінок більше немає.
          example: null
    OrderItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          example: p1
        quantity:
          type: integer
          minimum: 1
          example: 2
    Order:
      type: object
      required: [id, buyer_id, items, total_cents, status, created_at]
      properties:
        id:
          type: string
          example: o1
        buyer_id:
          type: string
          description: >
            Власник замовлення (id користувача з access-токена, hw-24).
            Використовує WS-gateway (hw-18) для перевірки на join у кімнату
            orders/{id} — анонімному або чужому клієнту відмовляє.
          example: u1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          type: integer
          description: Сума замовлення в копійках — без float.
          example: 129900
        status:
          type: string
          enum: [new, packed, shipped, delivered, cancelled]
          example: new
        created_at:
          type: string
          format: date-time
          example: '2026-08-20T09:12:00.000Z'
    OrderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: Токен наступної сторінки; null = сторінок більше немає.
          example: null
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        buyer_id:
          type: string
          deprecated: true
          description: >
            hw-24: ІГНОРУЄТЬСЯ. Власник замовлення — це sub із access-токена;
            довіряти полю з тіла означало б дозволити створювати замовлення
            від чужого імені.
          example: u1
    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, packed, shipped, delivered, cancelled]
          example: packed
    CreateProductRequest:
      type: object
      required: [name, price_cents]
      properties:
        name:
          type: string
          minLength: 1
          example: Веб-камера
        price_cents:
          type: integer
          minimum: 0
          example: 99900
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: alice@auth.test
        password:
          type: string
          minLength: 1
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Підписаний JWT (ES256), короткий TTL.
        refresh_token:
          type: string
          description: Непрозорий випадковий рядок (НЕ JWT). У БД лежить лише його HMAC.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Секунд до exp access-токена.
          example: 600
    Problem:
      type: object
      description: RFC 9457 problem+json — єдина форма помилки для всіх 4xx.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URI типу помилки.
          example: https://api.marketplace.example/problems/404
        title:
          type: string
          description: Коротка людська назва класу помилки.
          example: Ресурс не знайдено
        status:
          type: integer
          description: HTTP-код відповіді.
          example: 404
        detail:
          type: string
          description: Що саме пішло не так у цьому конкретному випадку.
          example: 'замовлення "o99" не знайдено'
        instance:
          type: string
          description: Посилання на конкретний випадок (шлях запиту).
          example: /orders/o99
  responses:
    BadRequest:
      description: Некоректний запит (валідація не пройшла)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: >
        Немає, протух або зіпсований токен (підпис, exp, денилист) —
        клієнт має піти рефрешити токен або перелогінитись.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >
        Токен валідний, але прав немає (роль або власність) — рефреш
        нічого не змінить.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
