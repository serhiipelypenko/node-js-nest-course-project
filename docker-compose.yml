services:
  db:
    image: postgres:16-alpine
    environment:
      # пароль superuser-а postgres; роль застосунку `marketplace` створює init.sql
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # hw-12: SQL-кроки змонтовані в контейнер — psql -f /db/schema.sql працює
      # без host-клієнта (git clone -> docker compose up -d db --wait -> готово)
      - ./db:/db:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  # hw-15: пулер зʼєднань на боці БД. Застосунок і CLI ходять у базу через нього.
  # Порт 6432 опублікований — SHOW POOLS / psql з хоста: psql -h 127.0.0.1 -p 6432.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # pg_isready не логіниться — не залежить від пароля ролі, який ротується
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketplace-api:latest
    depends_on:
      pgbouncer:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # hw-15: у мережі compose застосунок ходить у БД через PgBouncer
      # (сервіс `pgbouncer`, порт 6432), а не напряму в `db`; пароля в DSN немає
      DB_URL: postgres://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      # той самий файл, що переписує rotate.sh; :ro — контейнер його лише читає
      - ./secrets/db_password:/run/secrets/db_password:ro

volumes:
  db_data:
