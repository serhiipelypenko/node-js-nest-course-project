services:
  db:
    image: postgres:16-alpine
    environment:
      # пароль superuser-а postgres; роль застосунку `marketplace` створює init.sql
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # hw-12: SQL-кроки змонтовані в контейнер — psql -f /db/schema.sql працює
      # без host-клієнта (git clone -> docker compose up -d db --wait -> готово)
      - ./db:/db:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  # hw-15: пулер зʼєднань на боці БД. Застосунок і CLI ходять у базу через нього.
  # Порт 6432 опублікований — SHOW POOLS / psql з хоста: psql -h 127.0.0.1 -p 6432.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # pg_isready не логіниться — не залежить від пароля ролі, який ротується
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketplace-api:latest
    depends_on:
      pgbouncer:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # hw-15: у мережі compose застосунок ходить у БД через PgBouncer
      # (сервіс `pgbouncer`, порт 6432), а не напряму в `db`; пароля в DSN немає
      DB_URL: postgres://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
      # hw-24: ключ підпису й «перець» — зі СХОВИЩА, не з цього файла (у git їм
      # не місце): `bash scripts/with-secrets.sh dev docker compose up --build`
      # прокидає їх з оточення. Порожні -> api падає на валідації й називає змінну.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_KID: ${JWT_KID:-}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-}
      JWT_PREVIOUS_KID: ${JWT_PREVIOUS_KID:-}
      JWT_PREVIOUS_PUBLIC_KEY: ${JWT_PREVIOUS_PUBLIC_KEY:-}
    volumes:
      # той самий файл, що переписує rotate.sh; :ro — контейнер його лише читає
      - ./secrets/db_password:/run/secrets/db_password:ro

  # hw-19: брокер повідомлень. -management — щоб x-death і політики було видно
  # очима (UI :15672) і щоб мати HTTP API. AMQP — порт 5672 (саме його і
  # треба в BROKER_URL; на 15672 відповідає вебморда, а не AMQP).
  # consumer_timeout лишено стоковим (30 хв): обґрунтування prefetch у README.
  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    hostname: marketplace-rabbit
    environment:
      # dev-креденшели, навмисно в git — як `marketplace` у db (свіжий клон
      # має підніматись однією командою)
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # чесна готовність Erlang-ноди, а не «TCP-порт відкрився»
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # hw-23: ДВА інстанси Redis — не примха. Кеш вимагає maxmemory + allkeys-lru
  # (витіснення — норма), BullMQ — noeviction («cannot work properly if Redis
  # evicts keys arbitrarily»). maxmemory-policy одна на весь процес, SELECT 1 її
  # не розводить. Порти 6379/6380 — поза діапазоном лекції 22300-22399.
  redis-cache:
    image: redis:8-alpine
    command:
      - "redis-server"
      - "--maxmemory"
      - "32mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Черга BullMQ + сесії: noeviction і AOF everysec. Зберігаємо стан, який
  # не можна тихо втратити (сесія, задача). maxmemory не ставимо: при ліміті
  # noeviction віддасть OOM на запис, а не викине чужий ключ.
  redis-queue:
    image: redis:8-alpine
    command:
      - "redis-server"
      - "--maxmemory-policy"
      - "noeviction"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    ports:
      - "6380:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # hw-16: Pact Broker — контракт живе тут, а не в pacts/*.json консюмера;
  # can-i-deploy питає саме цей сервіс. Власна маленька база, ІЗОЛЬОВАНА від
  # `db` застосунку: брокер не має жодного стосунку до домену Marketplace.
  pact-broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker"]
      interval: 2s
      timeout: 2s
      retries: 15

  pact-broker:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://broker:broker@pact-broker-db/broker
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
    depends_on:
      pact-broker-db:
        condition: service_healthy
    healthcheck:
      # ВАЖЛИВО 127.0.0.1, не localhost: у контейнері localhost -> ::1, а puma слухає лише IPv4
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  db_data:
  redis_queue_data:
