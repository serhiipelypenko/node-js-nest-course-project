;; PgBouncer перед Postgres курсового (hw-15). Застосунок і CLI-скрипти ходять
;; у базу ЧЕРЕЗ нього (хост pgbouncer / порт 6432), а не напряму в db:5432.
;;
;; pool_mode = transaction: клієнт тримає «зʼєднання» з PgBouncer, а справжній
;; backend Postgres видається лише на час транзакції. Тому 100 клієнтів
;; ділять між собою 10 серверних зʼєднань.

[databases]
marketplace = host=db port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Автентифікація клієнтів — через auth_query: PgBouncer сам питає в Postgres
;; SCRAM-хеш ролі (функція pgbouncer.get_auth, створена в scripts/init.sql).
;; Чому не userlist.txt з паролем marketplace: rotate.sh (hw-11) міняє пароль
;; цієї ролі в БД — статичний файл із паролем одразу застарів би, і ротація
;; «без рестарту» зламалась би саме на PgBouncer. У userlist.txt лежить лише
;; службова роль pgbouncer_auth, пароль якої НЕ ротується.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)

pool_mode = transaction
default_pool_size = 10
max_client_conn = 200

;; Іменовані prepared statements у transaction mode падають («prepared
;; statement does not exist»): наступна транзакція може потрапити на інший
;; backend. 0 = не підтримуємо, клієнти (pg / TypeORM) їх і не використовують.
max_prepared_statements = 0

;; Адмін-консоль: psql -h 127.0.0.1 -p 6432 -U pgbouncer_auth -d pgbouncer
;;   SHOW POOLS; SHOW CLIENTS; SHOW SERVERS; SHOW STATS;
admin_users = pgbouncer_auth
stats_users = pgbouncer_auth

;; pg / psql шлють extra_float_digits при старті — PgBouncer його не знає.
ignore_startup_parameters = extra_float_digits
